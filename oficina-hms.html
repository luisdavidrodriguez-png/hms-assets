<title>Oficina HMS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: equipo a la izquierda | mundo 3D con tarjetas flotantes | ficha del agente a la derecha. En pantallas angostas se apila. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f5f6f8; --fg:#17202b; --muted:#5e6877; --line:#e0e4ea;
  --accent:#2a59d1; --accent-soft:#e8eefc;
  --ok:#21a058; --warn:#df9f12; --idle:#99a3b0;
  --late:#d63a3a; --today:#ea7a18; --week:#c9940a; --later:#2c9a5b; --none:#8a94a1;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.09);
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d25; --surface-2:#1c242e; --fg:#e8edf3; --muted:#9ba7b6; --line:#28323e;
  --accent:#7fa3ff; --accent-soft:#1d2945;
  --ok:#3cc27a; --warn:#f0b43a; --idle:#7d8a99;
  --late:#f06464; --today:#f39443; --week:#e2b33a; --later:#4cc282; --none:#8b97a6;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d25; --surface-2:#1c242e; --fg:#e8edf3; --muted:#9ba7b6; --line:#28323e;
  --accent:#7fa3ff; --accent-soft:#1d2945;
  --ok:#3cc27a; --warn:#f0b43a; --idle:#7d8a99;
  --late:#f06464; --today:#f39443; --week:#e2b33a; --later:#4cc282; --none:#8b97a6;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;display:flex;flex-direction:column;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.app{flex:1;min-height:0;display:grid;grid-template-columns:244px minmax(0,1fr) 352px;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
/* barra lateral */
.side{display:flex;flex-direction:column;gap:14px;padding:16px 12px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--fg);background:none;border:0;cursor:pointer;text-align:left;font-weight:500}
.nav a:hover,.nav button:hover{background:var(--surface-2)}
.nav .on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{flex:none}
.sec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px;margin:4px 0 -6px}
.team{display:flex;flex-direction:column;gap:2px}
.mate{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;text-align:left}
.mate:hover{background:var(--surface-2)}
.mate[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.mate .tx{min-width:0;flex:1}
.mate .nm{display:flex;align-items:center;gap:6px;font-weight:600}
.mate .rl{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--late);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;color:var(--muted);font-size:11.5px;padding:0 8px}
.av{flex:none;display:block}
/* escenario */
.main{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.stage{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,#bfe0f4 0%,#dcefe9 58%,#e7f2df 100%);box-shadow:var(--shadow)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#world:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:999px;
  background:rgba(255,255,255,.96);color:#17202b;font:600 12px var(--f-body);box-shadow:0 2px 8px rgba(20,30,50,.18);
  border:1px solid rgba(20,30,50,.08);white-space:nowrap;pointer-events:auto;cursor:pointer;will-change:transform;transition:background .15s,color .15s}
.tag .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center}
.tag:hover,.tag.hov{background:#fff;box-shadow:0 3px 12px rgba(20,30,50,.28)}
.tag.sel{background:#17202b;color:#fff}
.tag.you{background:#2a59d1;color:#fff;cursor:default;padding:3px 9px;font-size:11px}
.tag:focus-visible{outline:2px solid #2a59d1;outline-offset:2px}
.labels.compact .room{display:none}
.labels.compact .tag{font-size:10.5px;padding:2px 7px 2px 5px;gap:4px}
.labels.compact .tag .n{min-width:15px;height:15px;font-size:9.5px}
.room{position:absolute;left:0;top:0;font:700 10px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:#3d4552;
  background:rgba(255,255,255,.78);padding:3px 8px;border-radius:6px;white-space:nowrap;will-change:transform}
.float{position:absolute;z-index:2}
.hello{top:12px;left:12px;padding:12px 14px;max-width:min(372px,calc(100% - 80px))}
.hello h1{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.2;letter-spacing:-.01em}
.hello p{margin:3px 0 8px;color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tools{top:12px;right:12px;display:flex;flex-direction:column;gap:6px;padding:6px}
.tools button{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:10px;background:none;cursor:pointer;color:var(--fg)}
.tools button:hover{background:var(--surface-2)}
.tools hr{border:0;border-top:1px solid var(--line);margin:0 4px}
.stats{left:12px;bottom:12px;display:flex;gap:8px}
.stat{padding:9px 12px;min-width:92px}
.stat b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--muted);font-size:11px;line-height:1.25}
.hint{right:12px;bottom:12px;padding:7px 11px;font-size:11.5px;color:var(--muted)}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:3;color:#2f3a48;font:600 14px var(--f-body);background:linear-gradient(180deg,#bfe0f4,#e7f2df)}
.loading span{background:rgba(255,255,255,.85);padding:10px 16px;border-radius:12px}
.strip{display:none;flex-wrap:wrap;gap:8px}
.strip .mate{width:auto;padding:5px 10px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.strip .mate .rl{display:none}
/* panel */
.panel{display:flex;flex-direction:column;min-height:0;overflow:auto;padding:18px}
.panel h2{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.panel h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.panel section{padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}
.panel .sub{margin:2px 0 0;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:14px;width:fit-content}
.back:hover{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;gap:14px;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.desc{margin:12px 0 0}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;width:100%;text-align:left}
button.row{cursor:pointer}
button.row:hover{border-color:var(--line);background:var(--surface)}
.row p{margin:0;font-weight:500;line-height:1.35}
.row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.row .tx{min-width:0;flex:1}
.st{flex:none;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;margin-top:1px;border:1px solid currentColor}
.st.late{color:var(--late)} .st.today{color:var(--today)} .st.week{color:var(--week)} .st.later{color:var(--later)} .st.none{color:var(--none)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.kpi{background:var(--surface-2);border-radius:12px;padding:9px 8px}
.kpi b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:10.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.kpi.late b{color:var(--late)} .kpi.today b{color:var(--today)} .kpi.week b{color:var(--week)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--fg);background:var(--surface)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.next{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:0}
.teambars{display:flex;flex-direction:column;gap:8px}
.tb{display:grid;grid-template-columns:28px 76px minmax(0,1fr) 22px;align-items:center;gap:8px;font-size:12.5px}
.tb i{height:8px;border-radius:4px;background:var(--surface-2);display:block;overflow:hidden}
.tb i b{display:block;height:100%;border-radius:4px}
.tb em{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#2f3a48;z-index:4}
.fail div{background:#fff;border-radius:14px;padding:16px 18px;max-width:380px}
.live{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:9px}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.3}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--idle);display:block;flex:none}
.lv.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.lv.wait i{background:var(--warn)}
.lv.err{color:var(--late)} .lv.err i{background:var(--late)}
.lvbtn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:4px 10px;font:600 11.5px var(--f-body);cursor:pointer}
.lvbtn.ghost{background:none;color:var(--accent)}
.meetcard{margin:2px 0 8px 34px;border:1px solid var(--border2);border-radius:14px;background:var(--surface);padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.meetcard .mc-h{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}
.meetcard .mc-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);flex:none}
.meetcard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0 0 10px;font-size:12.5px}
.meetcard dt{color:var(--muted)} .meetcard dd{margin:0;overflow-wrap:anywhere}
.meetcard .mc-act{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.meetcard .mc-ok{margin:0 6px 0 0;color:var(--ok);font-weight:600;font-size:12.5px} .meetcard .mc-err{margin:0 0 4px;flex-basis:100%;color:var(--late);font-size:12.5px}
.lvicon{width:26px;height:26px;border-radius:8px;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.lvicon:hover{color:var(--accent)}
.lvicon.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.src{font-size:10px;letter-spacing:.02em;text-transform:none;font-weight:600;color:var(--muted);background:var(--surface-2);padding:1px 7px;border-radius:6px}
.empty{margin:0;color:var(--muted);font-size:13px}
.row .det{margin-top:4px;line-height:1.35}
.askcard{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--accent-soft);cursor:pointer;text-align:left;color:var(--fg)}
.askcard:hover{border-color:var(--accent)}
.askcard .tx{flex:1;min-width:0}
.askcard b{display:block;font-family:var(--f-display);font-size:14.5px}
.askcard small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-top:14px;flex:none}
.tabs button{flex:1;border:0;background:none;padding:7px 10px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.panel.chatmode{overflow:hidden}
.chat{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:12px}
.chathead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;min-height:22px}
.linkbtn{border:0;background:none;color:var(--accent);font:600 12px var(--f-body);cursor:pointer;padding:2px 4px;letter-spacing:0;text-transform:none;border-radius:6px;white-space:nowrap;flex:none}
.chathead span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn:hover{background:var(--accent-soft)}
.msgs{flex:1;min-height:150px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:2px 2px 10px;overscroll-behavior:contain}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg.me{justify-content:flex-end}
.msg .bc{min-width:0;max-width:calc(100% - 34px);display:flex;flex-direction:column;align-items:flex-start}
.msg .b{padding:9px 12px;border-radius:14px;background:var(--surface-2);line-height:1.45;min-width:0;max-width:100%;overflow-wrap:anywhere}
.msg.me .b{background:var(--accent);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap;max-width:85%}
.msg.ai .b{border-bottom-left-radius:4px}
.msg .b.err{background:none;border:1px dashed var(--line);color:var(--muted)}
.b p{margin:0 0 6px}.b p:last-child{margin-bottom:0}
.b ul{margin:2px 0 6px;padding-left:18px}.b ul:last-child{margin-bottom:0}.b li{margin:2px 0}
.typing{display:inline-flex;gap:4px;padding:5px 2px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.mnote{font-size:11.5px;color:var(--muted);margin-top:4px}
.mact{display:flex;gap:4px;margin-top:2px}
.mact button{border:0;background:none;color:var(--muted);font:500 11.5px var(--f-body);cursor:pointer;padding:3px 6px;border-radius:6px}
.mact button:hover{color:var(--accent);background:var(--surface-2)}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;flex:none}
.sugs button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;text-align:left}
.sugs button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.sugs button:disabled{opacity:.5;cursor:default}
.composer{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;background:var(--surface);flex:none}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;min-width:0;border:0;outline:0;background:none;resize:none;font:inherit;color:var(--fg);max-height:120px;padding:7px 0;line-height:1.4}
.composer textarea::placeholder{color:var(--muted)}
.ib{width:34px;height:34px;border-radius:10px;border:0;display:grid;place-items:center;cursor:pointer;background:var(--surface-2);color:var(--fg);flex:none}
.ib.send{background:var(--accent);color:#fff}
.ib.send.stop{background:var(--fg);color:var(--surface)}
.ib.rec{background:var(--late);color:#fff;animation:pulse 1.2s infinite}
.ib:disabled{opacity:.45;cursor:default}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--late) 25%,transparent)}}
.cnote{color:var(--muted);font-size:11.5px;margin:6px 2px 0;flex:none}
.cpart{color:var(--fg);font-size:12.5px;font-style:italic;margin:6px 2px 0;opacity:.7;flex:none}
.tag.talk::after{content:"";position:absolute;right:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#2a59d1;box-shadow:0 0 0 3px rgba(42,89,209,.25);animation:ping 1s infinite}
@keyframes ping{50%{transform:scale(1.35)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr) 330px}
  .hint{display:none}
  .side{display:none}
  .strip{display:flex}
}
@media (max-width:780px){
  html,body{height:auto}
  body{display:block}
  .app{display:flex;flex-direction:column;min-height:auto}
  .hello{top:auto;bottom:12px;padding:10px 12px}
  .hello h1{font-size:16px}
  .hello p{display:none}
  .stage{flex:none;height:64vh;min-height:400px}
  .panel{overflow:visible}
  .hint{display:none}
  .stats{display:none}
  .hello{max-width:calc(100% - 70px)}
  .panel.chatmode{overflow:visible}
  .msgs{max-height:55vh}
}
@media (prefers-reduced-motion:reduce){.tag{transition:none}.typing span,.ib.rec,.tag.talk::after,.lvicon.spin svg{animation:none}}
</style>

<div class="app">
  <aside class="side card" aria-label="Equipo">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="9" width="30" height="21" rx="4" fill="#2a59d1"/><rect x="6" y="4" width="8" height="6" rx="2" fill="#2a59d1"/><rect x="20" y="4" width="8" height="6" rx="2" fill="#2a59d1"/><rect x="6" y="4" width="8" height="2" rx="1" fill="#5b82e6"/><rect x="20" y="4" width="8" height="2" rx="1" fill="#5b82e6"/><rect x="2" y="9" width="30" height="3" rx="1.5" fill="#5b82e6"/></svg>
      <div><b>Oficina HMS</b><small>Holcim Modular Solutions</small></div>
    </div>

  const form = $('#composer'), cin = $('#cin'), mic = $('#mic'), nb = $('#newChat');

    e.preventDefault();

    if(c.busy){ if(e.submitter && e.submitter.id === 'sendBtn' && c.ctl) c.ctl.abort(); return; }
    const v = cin.value; if(!v.trim()) return;
    cin.value = ''; autosize(cin); send(a, v);

function errCopy(e){
  const code = e && e.code;
  if(code === 'rate_limited') return e.reason === 'usage_limit' ? 'Llegaste al límite de uso de Claude por ahora. Intenta más tarde.' : 'Muchas preguntas seguidas. Espera un momento y vuelve a intentar.';
  if(code === 'session_expired') return 'Tu sesión de Claude expiró. Vuelve a iniciar sesión.';
  if(code === 'prompt_too_large') return 'La conversación quedó muy larga. Empieza una nueva.';
  if(code === 'empty_completion') return 'No llegó respuesta. Pregúntale de otra forma.';
  if(code === 'not_granted') return 'No se dio permiso para usar Claude en esta página.';
  if(code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') return 'El chat no está disponible en esta vista.';
  return 'Se cortó la conexión. Intenta de nuevo.';
}
async function send(a, raw){
  const c = chatOf(a.id), text = String(raw || '').trim();
  if(!text || c.busy || !SAMPLE || SSTATE !== 'ready') return;
  c.turns.push({role:'user', content:text});
  const reply = {role:'assistant', content:'', pending:true};
  c.turns.push(reply);
  c.busy = true;
  const ctl = c.ctl = new AbortController();
  if(W) W.talk(a.id, true);
  renderMsgs(a);
  const hist = c.turns.filter(t => t !== reply && !t.failed && t.content).slice(-16).map(t => ({role:t.role, content:t.content}));
  const useTools = a.id === 'lilliana' && await toolsOk();
  const input = [{role:'user', content:rulesFor(a) + (useTools ? schedRules() : '')}, ...hist];
  try {
    const opts = {modelTier:'quick', signal:ctl.signal, onText:({text:t}) => { reply.content = t; paintReply(reply); }};
    if(useTools) opts.tools = schedTools(a); else opts.cache = false;
    const res = await SAMPLE(input, opts);
    reply.content = res.text;
    if(res.truncated) reply.note = 'La respuesta quedó cortada. Pide algo más corto.';
  } catch(e){
    const code = e && e.code;
    if(code === 'refused'){ reply.content = ''; reply.note = `${a.name} no puede responder eso. Prueba con otra pregunta.`; }
    else if(code === 'cancelled'){ reply.content = (e && e.text) || reply.content; reply.note = 'Detenido.'; }
    else {
      reply.content = (e && e.text) || reply.content;
      reply.note = errCopy(e);
      if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){
        SSTATE = 'off';
        OFFMSG = code === 'not_granted' ? 'No se dio permiso para que esta página use Claude. Puedes cambiarlo en el menú de permisos del artefacto.' : 'El chat no está disponible para esta cuenta en esta vista.';
      }
    }
    if(!reply.content) reply.failed = true;
  } finally {
    reply.pending = false; c.busy = false; c.ctl = null;
    if(W) W.talk(a.id, false);
    if(CUR === a.id) renderMsgs(a);
  }
}

}

function findValues(p, depth = 0){
  if(p == null || depth > 4) return null;
  if(typeof p === 'string'){ try { return findValues(JSON.parse(p), depth + 1); } catch(e){ return null; } }
  if(Array.isArray(p)) return p.length && Array.isArray(p[0]) ? p : null;
  if(typeof p === 'object'){
    if(Array.isArray(p.values)) return p.values;
    for(const k of Object.keys(p)){ const v = findValues(p[k], depth + 1); if(v) return v; }

}

async function initLive(){
  const CL = window.claude;

  try { [MCP, PERMS] = await Promise.all([CL.use('mcp'), CL.use('permissions')]); } catch(e){ MCP = null; }
  if(!MCP){ setLive('snapshot'); return; }
  let st = 'prompt';
  if(PERMS){ try { st = await PERMS.state('mcp:' + SHEETS); } catch(e){ st = 'prompt'; } }
  if(st === 'granted') startWatch();
  else if(st === 'denied') setLive('error', 'No diste permiso para leer Google Sheets en esta página.', 'perms');
  else setLive('ask');
}
function startWatch(){
  stopWatch();

  try {
    LIVE.unsub.push(MCP.watchTool(SHEETS, 'get_values', IN_P, ev => onEvent('p', ev), WOPTS));
    LIVE.unsub.push(MCP.watchTool(SHEETS, 'get_values', IN_D, ev => onEvent('d', ev), WOPTS));
    Object.keys(EXT).forEach(k => LIVE.unsub.push(MCP.watchTool(SHEETS, 'get_values', EXT[k].inp, ev => onEvent(k, ev), WOPTS)));

function onEvent(kind, ev){

  if(ev.type === 'data'){
    const values = findValues(ev.result && ev.result.payload);
    const at = (ev.result && ev.result.cache && ev.result.cache.storedAt) || Date.now();
    if(kind === 'p'){
      if(values) applyPendientes(values, at);
      else if(DATA.mode !== 'live') setLive('error', 'La hoja de pendientes llegó vacía.', 'retry');
    } else if(kind === 'd'){ if(values) applyDiffs(values); }

function handleErr(kind, e){
  const code = e && e.code;

  if(code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed'){ stopWatch(); revertSnapshot(); setLive('snapshot'); return; }
  if(code === 'user_changed'){ stopWatch(); return; }
  if(EXT[kind] && code !== 'not_granted' && code !== 'capability_disabled' && code !== 'capability_removed'){ if(DENIALS[code]) resetExt(kind); return; }

    if(kind === 'd'){ DIFFS = DIFFS_SNAP; DIFFS_LIVE = false; LIVE.sigD = ''; return; }

}
async function oneShot(){
  if(!MCP || LIVE.busy) return;
  LIVE.busy = true; setLive('connecting');
  try {
    const res = await MCP.callTool(SHEETS, 'get_values', IN_P, {cache:{staleTime:0, gcTime:604800000, refresh:true}});
    const values = findValues(res && res.payload);
    LIVE.busy = false;
    if(!values){ setLive('error', 'La hoja de pendientes llegó vacía.', 'retry'); return; }
    applyPendientes(values, (res.cache && res.cache.storedAt) || Date.now());
    startWatch();
  } catch(e){ handleErr('p', e); }
}
function refreshNow(){
  if(!MCP || LIVE.busy) return;

}

    if(pointers.size === 2){ const [a, b] = [...pointers.values()]; pinch = {d:Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), z:goal.zoom}; moved = true; }
  });
  canvas.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if(!p){ if(e.pointerType === 'mouse') hoverPick(e); return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if(pointers.size === 1){ if(Math.hypot(e.clientX - start.x, e.clientY - start.y) > 6) moved = true; if(moved) pan(dx, dy); }
    else if(pointers.size === 2 && pinch){ const [a, b] = [...pointers.values()]; goal.zoom = clampZ(pinch.z*Math.hypot(a.x - b.x, a.y - b.y)/pinch.d); userZoomed = true; }
  });
  const endP = e => { if(!pointers.has(e.pointerId)) return; pointers.delete(e.pointerId); if(pointers.size < 2) pinch = null; if(pointers.size === 0 && !moved && e.type === 'pointerup'){ const id = pick(e); if(id) select(id, 'world'); } };
  canvas.addEventListener('pointerup', endP); canvas.addEventListener('pointercancel', endP);
  canvas.addEventListener('pointerleave', () => { if(!pointers.size){ setHover(null); canvas.style.cursor = ''; } });
  canvas.addEventListener('wheel', e => { e.preventDefault(); goal.zoom = clampZ(goal.zoom*Math.exp(-e.deltaY*.0016)); userZoomed = true; }, {passive:false});
  canvas.addEventListener('keydown', e => {
    const k = e.key;
    if(k === 'ArrowLeft') pan(60, 0); else if(k === 'ArrowRight') pan(-60, 0); else if(k === 'ArrowUp') pan(0, 60); else if(k === 'ArrowDown') pan(0, -60);
    else if(k === '+' || k === '='){ goal.zoom = clampZ(goal.zoom*1.25); userZoomed = true; } else if(k === '-'){ goal.zoom = clampZ(goal.zoom/1.25); userZoomed = true; }
    else return; e.preventDefault();
  });
  function pan(dx, dy){
    const wpp = (2*FH/view.zoom)/stage.clientHeight, az = view.az;
    const rx = Math.cos(az), rz = -Math.sin(az), fx = -Math.sin(az), fz = -Math.cos(az), kv = wpp/Math.sin(ELEV);
    goal.x += -rx*dx*wpp + fx*dy*kv; goal.z += -rz*dx*wpp + fz*dy*kv; clampG(); view.x = goal.x; view.z = goal.z;
  }
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(e){
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
    ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(hitboxes, false);
    return h.length ? h[0].object.userData.id : null;
  }
  let lastHover = 0;
  function hoverPick(e){ const now = performance.now(); if(now - lastHover < 50) return; lastHover = now; const id = pick(e); setHover(id); canvas.style.cursor = id ? 'pointer' : ''; }
  $('#rotL').addEventListener('click', () => { goal.az -= Math.PI/2; });
  $('#rotR').addEventListener('click', () => { goal.az += Math.PI/2; });
  $('#zIn').addEventListener('click', () => { goal.zoom = clampZ(goal.zoom*1.3); userZoomed = true; });
  $('#zOut').addEventListener('click', () => { goal.zoom = clampZ(goal.zoom/1.3); userZoomed = true; });
  $('#home').addEventListener('click', () => { showSummary(); home(); });

  function focus(id, move){
    if(selId && tagEls[selId]) tagEls[selId].classList.remove('sel');
    selId = id;
    if(!id){ ring.visible = false; return; }
    tagEls[id].classList.add('sel');
    const f = figs[id]; ring.visible = true; ring.position.set(f.base.x, .02, f.base.z);
    if(move){ goal.x = f.base.x; goal.z = f.base.z; goal.zoom = clampZ(Math.max(goal.zoom, fitZoom()*1.85)); }
  }

  /* ----- animación ----- */
  const tmp = new THREE.Vector3();
  function animFig(f, t){
    const ph = f.phase;
    if(f.pose === 'type'){
      f.armL.rotation.x = -1.2 + Math.sin(t*12 + ph)*.07; f.armR.rotation.x = -1.2 + Math.sin(t*12 + ph + Math.PI)*.07;
      f.armL.rotation.z = -.12; f.armR.rotation.z = .12;
      f.head.rotation.y = Math.sin(t*.5 + ph)*.22; f.head.rotation.x = .06 + Math.sin(t*.9 + ph)*.04;
    } else if(f.pose === 'present'){
      f.armL.rotation.z = 1.25 + Math.sin(t*1.6)*.12; f.armL.rotation.x = -.35;
      f.armR.rotation.x = -.5 + Math.sin(t*1.1)*.08;
      f.head.rotation.y = .5 + Math.sin(t*.45)*.55;
      f.body.position.y = Math.abs(Math.sin(t*1.6))*.006;
    } else if(f.pose === 'coffee'){
      const c = (t + ph) % 7, lift = c < 1.6 ? Math.sin(c/1.6*Math.PI) : 0;
      f.armR.rotation.x = -.9 - lift*1.25; f.armR.rotation.z = .05 + lift*.25;
      f.head.rotation.x = -lift*.18; f.head.rotation.y = lift ? 0 : Math.sin(t*.4 + ph)*.35;
      f.armL.rotation.x = -.15; f.body.position.y = Math.sin(t*1.4)*.004;
    } else if(f.pose === 'phone'){
      f.armR.rotation.x = -1.15 + Math.sin(t*9 + ph)*.03; f.armR.rotation.z = .28;
      f.armL.rotation.x = -1.05; f.armL.rotation.z = -.28;
      f.head.rotation.x = .3; f.head.rotation.y = Math.sin(t*.3 + ph)*.1;
    } else if(f.pose === 'tablet'){
      f.armL.rotation.x = -1.1; f.armL.rotation.z = -.15; f.armR.rotation.x = -1.0 + Math.sin(t*2.2 + ph)*.08; f.armR.rotation.z = .2;
      const look = Math.max(0, Math.sin(t*.35 + ph)); f.head.rotation.y = -look*.75; f.head.rotation.x = .28*(1 - look);
    }
    f.head.rotation.z = f.talking ? Math.sin(t*11)*.08 : 0;
  }
  function stepYou(dt, t){
    const f = you;
    if(yst.wait > 0){
      yst.wait -= dt;
      let diff = yst.face - yst.ry; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); yst.ry += diff*Math.min(1, dt*6);
      f.legL.rotation.x *= Math.max(0, 1 - dt*8); f.legR.rotation.x = -f.legL.rotation.x;
      f.armR.rotation.x = -.9 + Math.sin(t*3)*.06; f.armL.rotation.x = -.15; f.head.rotation.y = Math.sin(t*.8)*.3; f.body.position.y = 0;
    } else {
      const tg = youPath[yst.i].p, dx = tg[0] - yst.x, dz = tg[1] - yst.z, d = Math.hypot(dx, dz);
      if(d < .04){ const w = youPath[yst.i]; if(w.wait){ yst.wait = w.wait; yst.face = w.face; } yst.i = (yst.i + 1) % youPath.length; }
      else {
        const sp = Math.min(d, .95*dt); yst.x += dx/d*sp; yst.z += dz/d*sp;
        let diff = Math.atan2(dx, dz) - yst.ry; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); yst.ry += diff*Math.min(1, dt*8);
        yst.ph += dt*7.5; const sw = Math.sin(yst.ph);
        f.legL.rotation.x = sw*.55; f.legR.rotation.x = -sw*.55; f.armL.rotation.x = -sw*.45; f.armR.rotation.x = sw*.45; f.head.rotation.y = 0;
        f.body.position.y = Math.abs(Math.cos(yst.ph))*.025;
      }
    }
    f.root.position.set(yst.x, 0, yst.z); f.root.rotation.y = yst.ry;
    youLabel.p.set(yst.x, FL + 1.5, yst.z);
  }
  function updateTall(){
    const s = Math.sin(view.az), c = Math.cos(view.az);
    tall.forEach(g => { const f = (g.userData.cx - view.x)*s + (g.userData.cz - view.z)*c; g.visible = f < 6; });
  }
  let compact = null;
  function updateLabels(){
    const w = stage.clientWidth, h = stage.clientHeight, c = view.zoom < .68;
    if(c !== compact){ compact = c; labelsEl.classList.toggle('compact', c); }
    for(const L of labels){
      tmp.copy(L.p).project(camera);
      const x = (tmp.x*.5 + .5)*w, y = (-tmp.y*.5 + .5)*h, vis = tmp.z < 1 && x > -80 && x < w + 80 && y > -40 && y < h + 60;
      if(vis !== L.vis){ L.el.style.display = vis ? '' : 'none'; L.vis = vis; }
      if(vis) L.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) ${L.off}`;
    }
  }
  const clock = new THREE.Clock(); let first = true;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    const k = RM ? 1 : 1 - Math.pow(.0012, dt);
    view.x += (goal.x - view.x)*k; view.z += (goal.z - view.z)*k; view.az += (goal.az - view.az)*k; view.zoom += (goal.zoom - view.zoom)*k;
    applyCam(); updateTall();
    if(!RM){
      Object.values(figs).forEach(f => animFig(f, t));
      stepYou(dt, t);
      cars.forEach(c => { c.s += c.dir*c.v*dt*10; placeCar(c); });
    } else if(first){ Object.values(figs).forEach(f => animFig(f, 0)); stepYou(0, 0); }
    if(ring.visible){ const s = 1 + Math.sin(t*4)*.08; ring.scale.set(s, s, s); }
    renderer.render(scene, camera); updateLabels();
    if(first){ first = false; $('#loading').hidden = true; }
  });
  function talk(id, on){ const f = figs[id]; if(f) f.talking = !!on; if(tagEls[id]) tagEls[id].classList.toggle('talk', !!on); }
  function refresh(){
    AGENTS.forEach(a => { const el = tagEls[a.id]; if(el) el.innerHTML = tagInner(a); });
    redraw(tvTex, drawTV); redraw(kanbanTex, drawKanban);
  }
  return {focus, home, talk, refresh};
}
})();
</script>
